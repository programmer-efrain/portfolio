<canvas id="mainLogo"></canvas>
<script>
    const canvas = document.getElementById("mainLogo");
    canvas.width = 167;
    canvas.height = 38;
    let showCursor = true;

    const ctx = canvas.getContext("2d");

    // Aseguramos que el fondo sea transparente (sin dibujar un fondo)
    canvas.style.backgroundColor = "transparent";

  function createCursor() {
    // Fondo del banner
    ctx.fillStyle = "#ffffff"; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  
    // Texto del banner
    ctx.font = "bold 23px monospace";
    /*
    Console
    system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, 
    "Noto Sans", "Liberation Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"
    */
    ctx.fillStyle = "#fca46d";
    ctx.fillText("$DEVELOPER", 5, 25);
  
    if (showCursor) {
     ctx.fillRect( ctx.measureText("$DEVELOPER").width + 5, 10, 12, 17);
    } else {
      ctx.fillRect( ctx.measureText("$DEVELOPER").width + 5, 23, 12, 3);
    }
  }

  function toggleCursor() {
    showCursor = !showCursor;
    createCursor();
  }

  setInterval(toggleCursor, 500);
  createCursor();

  </script>
